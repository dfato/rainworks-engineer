name: build

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (with ONNX Runtime for voice models)
        run: cmake -S . -B build -A x64 -DVE_WITH_ONNX=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Engine tests + ONNX smoke test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check ONNX Runtime + DirectML ship inside the VST3 bundle
        shell: pwsh
        run: |
          foreach ($name in "onnxruntime.dll", "DirectML.dll") {
            $dll = Get-ChildItem -Recurse build/VocalEngine_artefacts/Release/VST3 -Filter $name
            if (-not $dll) { throw "$name missing from the VST3 bundle" }
            $dll.FullName
          }
      - uses: actions/upload-artifact@v4
        with:
          name: EngineByRainWorks-VST3-win64
          path: build/VocalEngine_artefacts/Release/VST3/

  windows-no-onnx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (VE_WITH_ONNX=OFF)
        run: cmake -S . -B build -A x64
      - name: Build plugin
        run: cmake --build build --config Release --target VocalEngine_VST3 --parallel

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Engine tests
        run: ctest --test-dir build --output-on-failure
