name: build

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export the neural pitch model (FCPE, MIT)
        shell: pwsh
        run: |
          python -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet torchfcpe==0.0.4 onnx onnxruntime numpy soundfile
          New-Item -ItemType Directory -Force build | Out-Null
          python tools/pitch-models/export_fcpe.py --out build/pitch-fcpe.onnx
      - name: Configure (with ONNX Runtime for voice models)
        run: cmake -S . -B build -A x64 -DVE_WITH_ONNX=ON -DVE_PITCH_MODEL_FILE="${{ github.workspace }}/build/pitch-fcpe.onnx"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Engine tests + ONNX smoke test (neural pitch and technique models included)
        env:
          VE_PITCH_MODEL: ${{ github.workspace }}/build/pitch-fcpe.onnx
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Neural vs DSP pitch on vocadito (CC BY 4.0, reference f0)
        shell: pwsh
        env:
          VE_PITCH_MODEL: ${{ github.workspace }}/build/pitch-fcpe.onnx
        run: |
          Invoke-WebRequest https://zenodo.org/api/records/5578807/files/vocadito.zip/content -OutFile vocadito.zip
          Expand-Archive vocadito.zip -DestinationPath vocadito
          python tools/pitch-models/eval_pitch.py --tool build/EngineerStyleLearn_artefacts/Release/EngineerStyleLearn.exe `
            --audio vocadito/Audio --f0 vocadito/Annotations/F0 --config "dsp:--engine dsp" --config "neural:--engine neural"
      - name: Check ONNX Runtime, DirectML and the pitch model ship inside the VST3 bundle
        shell: pwsh
        run: |
          foreach ($name in "onnxruntime.dll", "DirectML.dll", "pitch-fcpe.onnx") {
            $dll = Get-ChildItem -Recurse build/VocalEngine_artefacts/Release/VST3 -Filter $name
            if (-not $dll) { throw "$name missing from the VST3 bundle" }
            $dll.FullName
          }
      - uses: actions/upload-artifact@v4
        with:
          name: EngineByRainWorks-VST3-win64
          path: build/VocalEngine_artefacts/Release/VST3/

  windows-no-onnx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (VE_WITH_ONNX=OFF)
        run: cmake -S . -B build -A x64
      - name: Build plugin
        run: cmake --build build --config Release --target VocalEngine_VST3 --parallel

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Engine tests
        run: ctest --test-dir build --output-on-failure
