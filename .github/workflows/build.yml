name: build

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: EngineByRainWorks-VST3-win64
          path: build/VocalEngine_artefacts/Release/VST3/

  windows-onnx-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (VE_WITH_ONNX=ON)
        run: cmake -S . -B build -A x64 -DVE_WITH_ONNX=ON
      - name: Build smoke test
        run: cmake --build build --config Release --target VocalEngineOnnxSmokeTest --parallel
      - name: Run smoke test
        run: ctest --test-dir build -C Release -R onnx_smoke --output-on-failure

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Engine tests
        run: ctest --test-dir build --output-on-failure
